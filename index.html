<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Wallet</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>
</head>
<body>
    <div class="wallet-app">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <div class="avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div>
                    <div class="username">@CryptoSam</div>
                    <div class="name">Samuel Budiarti</div>
                </div>
            </div>
            <div class="balance-section">
                <div class="total-balance" id="balanceAmount">$58.75</div>
                <div class="change positive">
                    +$1.22 &nbsp; +2.12%
                </div>
            </div>
        </header>

        <!-- Action Buttons -->
        <div class="actions">
            <div class="action-btn" onclick="showFeature('add')">
                <i class="fas fa-plus"></i>
                <span>Add Funds</span>
            </div>
            <div class="action-btn" onclick="showFeature('send')">
                <i class="fas fa-arrow-up"></i>
                <span>Transfer</span>
            </div>
            <div class="action-btn" onclick="showFeature('swap')">
                <i class="fas fa-exchange-alt"></i>
                <span>Exchange</span>
            </div>
            <div class="action-btn" onclick="showFeature('buy')">
                <i class="fas fa-credit-card"></i>
                <span>Purchase</span>
            </div>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search tokens or discover new assets" id="searchInput">
        </div>

        <!-- Trending Tokens -->
        <div class="trending-section">
            <div class="section-header">
                <h2>Trending Tokens</h2>
                <select class="time-filter">
                    <option>Today</option>
                </select>
            </div>
            <div class="tokens-list" id="tokensList">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab(0)"><i class="fas fa-home"></i></div>
            <div class="nav-item" onclick="switchTab(1)"><i class="fas fa-wallet"></i></div>
            <div class="nav-item center" onclick="showFeature('swap')"><i class="fas fa-exchange-alt"></i></div>
            <div class="nav-item" onclick="switchTab(3)"><i class="fas fa-chart-bar"></i></div>
            <div class="nav-item" onclick="switchTab(4)"><i class="fas fa-cog"></i></div>
        </nav>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
